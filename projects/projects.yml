# Software and data, shown on /projects, numbered in this order (newest first, by start year).
#
# Fields
#   title        (required)
#   years        free text: "2026", "2022 — 2024", "2022 — ongoing"
#   types        filters it shows under: stata | r | latex | apps | teaching | data
#   kind         short label shown next to the years, e.g. "Stata · VS Code extension"
#   status       optional word after the title, e.g. "in progress", "prototype"
#   description  one or two sentences
#   repo         GitHub URL (leave out for private repos)
#   live         live site or app
#   release      releases page
#   install      one line to copy (net install …, remotes::install_github(…))
#   also         teaching: also list it on /teaching under Teaching tools

- title: "Stata Console for VS Code"
  years: "2026 — ongoing"
  types: [stata, apps]
  kind: "Stata · VS Code extension"
  description: >-
    An interactive Stata session inside VS Code: console, data viewer, variables panel,
    plots, and help viewer, in the spirit of what Positron does for R.
  repo: "https://github.com/RRMaximiliano/stata-console"
  release: "https://github.com/RRMaximiliano/stata-console/releases"

- title: "StataBench"
  years: "2026 — ongoing"
  types: [stata]
  kind: "Stata · benchmark"
  status: "in progress"
  description: >-
    A benchmark that tests whether AI models can do the work of a pre-doctoral RA in real
    Stata: cleaning messy data, merging and reshaping, and estimating treatment effects with
    the right inference, all graded automatically.

- title: "highlightex"
  years: "2026"
  types: [latex]
  kind: "LaTeX package"
  description: >-
    Hand-drawn highlighters and mood stickers for LaTeX documents.
  repo: "https://github.com/RRMaximiliano/highlightex"

- title: "Econ Papers Terminal"
  years: "2026 — ongoing"
  types: [apps]
  kind: "web app"
  status: "prototype"
  description: >-
    A daily feed of new papers in labor, public, and education economics from NBER, CEPR,
    World Bank working papers, and the top journals.
  live: "https://econ-papers-terminal.vercel.app"

- title: "Teachvatory"
  years: "2026 — ongoing"
  types: [teaching, apps]
  kind: "teaching app"
  also: teaching
  status: "invite only"
  description: >-
    A workspace for course teaching teams. It brings in the class roster and quiz responses,
    shows how each question went, flags students who may need a check-in, summarizes
    open-ended answers with AI, and pulls it together into a short brief before each class.
  # No link while it's invite only. Add `live:` back when it opens up.

- title: "LeafBridge"
  years: "2026"
  types: [apps, latex]
  kind: "desktop app"
  description: >-
    Keeps a local paper folder in sync with Overleaf, for when one coauthor works locally
    with Git and the other works only in Overleaf.
  repo: "https://github.com/RRMaximiliano/leafbridge"

- title: "Latin America Education Policy Database"
  years: "2026"
  types: [data]
  kind: "database · website"
  description: >-
    A catalog of 100+ education policies across Latin America and the Caribbean, evaluated or
    not, with their mechanisms, coverage, and the quality of the evidence behind them.
  live: "https://www.rrmaximiliano.com/ed-policies/"
  repo: "https://github.com/RRMaximiliano/ed-policies"

- title: "Nicaraguan Public Schools"
  years: "2025"
  types: [data]
  kind: "dataset"
  description: >-
    All 10,252 schools in Nicaragua's 17 departments and 153 municipalities, scraped from the
    Ministry of Education's school map.
  repo: "https://github.com/RRMaximiliano/nicaraguan-public-schools"

- title: "Stata for Raycast"
  years: "2025"
  types: [stata, apps]
  kind: "Raycast extension"
  description: >-
    Open recent do-files and datasets, start do-files from templates, and look up Stata
    documentation from Raycast.
  repo: "https://github.com/RRMaximiliano/stata-raycast-extension"

- title: "RStudio for Raycast"
  years: "2025"
  types: [r, apps]
  kind: "Raycast extension"
  description: >-
    Open recent RStudio projects and create new ones from Raycast.
  repo: "https://github.com/RRMaximiliano/rstudio-raycast-extension"

- title: "Harvard Library Redirect"
  years: "2025 — 2026"
  types: [apps]
  kind: "Chrome extension"
  description: >-
    Reopens the current page through the Harvard Library login, so paywalled articles load
    with one click.
  repo: "https://github.com/RRMaximiliano/harvard-ezproxy-extension"
  release: "https://github.com/RRMaximiliano/harvard-ezproxy-extension/releases"

- title: "International Students in the U.S."
  years: "2024"
  types: [data]
  kind: "dataset"
  description: >-
    Data and figures on international students in the United States.
  repo: "https://github.com/RRMaximiliano/international-students"

- title: "awf"
  years: "2023"
  types: [stata]
  kind: "Stata command"
  status: "alpha"
  description: >-
    A Stata implementation of the distribution-sensitive index of welfare, poverty, and
    inequality proposed by Kraay et al. (2023).
  repo: "https://github.com/RRMaximiliano/awf"
  install: 'net install awf, from("https://raw.githubusercontent.com/rrmaximiliano/awf/main") replace'

- title: "Canasta Básica de Nicaragua"
  years: "2022 — ongoing"
  types: [data, r]
  kind: "dataset · Shiny app"
  description: >-
    Nicaragua's basic food basket prices from INIDE, collected automatically, with real
    (inflation-adjusted) prices and an app to explore them.
  live: "https://rrmaximiliano.shinyapps.io/inide-canasta-basica/"
  repo: "https://github.com/RRMaximiliano/inide-canasta-basica"

- title: "Migrant Encounters at the U.S. Border"
  years: "2022 — 2024"
  types: [data]
  kind: "dataset"
  description: >-
    U.S. Border Patrol encounters by country of origin, region, and border sector since 2007,
    with figures for Nicaragua.
  repo: "https://github.com/RRMaximiliano/migrants_usbp"

- title: "Summary Statistics Tables in R"
  years: "2022"
  types: [r, latex]
  kind: "R · guide"
  description: >-
    Examples of summary-statistics and balance tables with modelsummary and gtsummary, for
    people coming to R from Stata.
  repo: "https://github.com/RRMaximiliano/r-latex-tables-sum-stats"

- title: "send_est"
  years: "2021"
  types: [stata, latex]
  kind: "Stata command"
  description: >-
    Writes a stored estimate to a LaTeX or text file, so the numbers in a paper update with
    the code.
  repo: "https://github.com/RRMaximiliano/send_est"
  install: 'net install send_est, from("https://raw.githubusercontent.com/rrmaximiliano/send_est/main") replace'

- title: "tvsc"
  years: "2021"
  types: [stata]
  kind: "Stata command"
  description: >-
    Covariate balance tables (treatment vs. control means and differences) in a
    publication-ready format.
  repo: "https://github.com/RRMaximiliano/tvsc"
  install: 'net install tvsc, from("https://raw.githubusercontent.com/rrmaximiliano/tvsc/main") replace'

- title: "constitucionesNic"
  years: "2021"
  types: [r, data]
