  description: >-
    Nicaragua's political constitutions as data, ready for text analysis.
  repo: "https://github.com/RRMaximiliano/constitucionesNic"
  install: 'remotes::install_github("RRMaximiliano/constitucionesNic")'

- title: "Excess Mortality"
  years: "2021"
  types: [data]
