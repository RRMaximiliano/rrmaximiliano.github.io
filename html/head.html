<script>
// The navbar flower closes at night (9 p.m.–6 a.m. on the visitor's clock; styles in
// html/custom.scss). Add ?night to the address to see it at any hour.
(() => {
  const h = new Date().getHours();
  if (h >= 21 || h < 6 || /[?&]night\b/.test(location.search)) document.documentElement.classList.add('flower-night');
})();
</script>
<script>
// Entrance motion helpers (styles in html/custom.scss):
// - "pre": the page is being prepared in the background; hold animations until it's shown.
// - "intro": the visit starts on the homepage; hold the page while the name types out.
// - "seen": not the first page of this visit; skip the entrance so pages swap without a blink.
(() => {
  const root = document.documentElement;
  try {
    if (document.prerendering) {
      root.classList.add('pre');
      document.addEventListener('prerenderingchange', () => root.classList.remove('pre'), { once: true });
    }
    // A page prepared in the background was opened from another page of the site, so it is
    // never the first page of the visit (its session storage may not be the tab's yet).
    const seen = document.prerendering || !!sessionStorage.getItem('entered');
    if (seen) root.classList.add('seen');
    sessionStorage.setItem('entered', '1');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const home = /^\/(index\.html)?$/.test(location.pathname);
    if (home && !reduce && !seen && !sessionStorage.getItem('intro-seen')) {
      root.classList.add('intro');
      setTimeout(() => root.classList.remove('intro'), 4000); // never leave the page held
    }
  } catch (e) { root.classList.remove('pre', 'intro'); }
})();
</script>

<script>
// Pages after the first: keep the page hidden until its fonts are ready (at most 0.4s).
// Chrome then leaves the previous page on screen instead of drawing a fallback font and
// swapping it a moment later (a blink). Runs after the @font-face rules above so the fonts
// are known; html/custom.scss reveals the page on its own if this script never finishes.
(() => {
  const root = document.documentElement;
  if (!root.classList.contains('seen') || !document.fonts) return;
  const faces = ['400 1em Newsreader', '500 1em Newsreader', '400 1em "IBM Plex Mono"', '500 1em "IBM Plex Mono"'];
  if (faces.every(f => document.fonts.check(f))) return;
  root.classList.add('font-wait');
  const show = () => root.classList.remove('font-wait');
  Promise.all(faces.map(f => document.fonts.load(f))).then(show, show);
  setTimeout(show, 400);
})();
</script>
