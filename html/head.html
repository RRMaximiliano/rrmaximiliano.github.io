<script>
// Entrance motion helpers (styles in html/custom.scss):
// - "pre": the page is being prepared in the background; hold animations until it's shown.
// - "intro": first homepage visit this session; hold the page while the name types out.
(() => {
  const root = document.documentElement;
  try {
    if (document.prerendering) {
      root.classList.add('pre');
      document.addEventListener('prerenderingchange', () => root.classList.remove('pre'), { once: true });
    }
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const home = /^\/(index\.html)?$/.test(location.pathname);
    if (home && !reduce && !sessionStorage.getItem('intro-seen')) {
      root.classList.add('intro');
      setTimeout(() => root.classList.remove('intro'), 4000); // never leave the page held
    }
  } catch (e) { root.classList.remove('pre', 'intro'); }
})();
</script>
<!-- Prepare the next page while the cursor rests on a link (Chrome/Edge), so it opens instantly. -->
<script type="speculationrules">
{
  "prerender": [{
    "where": {
      "and": [
        { "href_matches": "/*" },
        { "not": { "href_matches": ["/*.pdf", "/files/*", "/go/*", "/rrmrr-vita/*", "/cv/pages/*"] } },
        { "not": { "selector_matches": "[target=_blank], [download], [rel~=nofollow]" } }
      ]
    },
    "eagerness": "moderate"
  }]
}
</script>
