<script>

// Highlight the navbar section for pages below it (e.g. /office-hours/api-209/).
(() => {
  if (document.body.classList.contains('not-found')) return;   // 404 page: no section is current
  const here = location.pathname.replace(/index\.html$/, '');
  const links = [...document.querySelectorAll('#navbarCollapse .navbar-nav:not(.me-auto) a.nav-link')];
  if (links.some(a => a.classList.contains('active'))) return;
  let best = null, bestLen = 0;
  for (const a of links) {
    const p = new URL(a.href, location.href).pathname.replace(/index\.html$/, '');
    if (p.length > 1 && here.startsWith(p) && p.length > bestLen) { best = a; bestLen = p.length; }
  }
  if (best) { best.classList.add('active'); best.setAttribute('aria-current', 'page'); }
})();

// Navbar: the accent underline glides to the link under the pointer (or keyboard
// focus) and settles back under the current section. Wide screens only; styles
// in html/custom.scss.
(() => {
  const nav = document.querySelector('#navbarCollapse .navbar-nav.ms-auto');
  if (!nav) return;
  const links = [...nav.querySelectorAll('a.nav-link')];
  const wide = matchMedia('(min-width: 992px)');
  const bar = document.createElement('span');
  bar.className = 'nav-glide instant';   // first placement: no fade, so the underline never blinks on load
  bar.setAttribute('aria-hidden', 'true');
  nav.append(bar);
  let shown = null;
  const current = () => nav.querySelector('a.nav-link.active');
  const place = (a, animate = true) => {
    shown = a;
    nav.classList.toggle('glide-away', !!a && a !== current());   // dims the current link (CSS)
    if (!a) { bar.classList.remove('is-on'); return; }   // no current section (homepage): fade out
    const r = (a.querySelector('.menu-text') || a).getBoundingClientRect();
    const n = nav.getBoundingClientRect();
    // From hidden, appear under the link instead of sliding in from the last spot
    bar.classList.toggle('no-anim', !animate || !bar.classList.contains('is-on'));
    // Height is set with 'top' (layout snaps it to the pixel grid, unlike a transform),
    // on the row where the CSS underline sits, so the 1px line stays crisp
    bar.style.top = `${Math.floor(r.bottom + 2) - n.top}px`;
    bar.style.width = `${r.width}px`;
    bar.style.transform = `translateX(${r.left - n.left}px)`;
    bar.classList.add('is-on');
  };
  links.forEach(a => {
    a.addEventListener('mouseenter', () => place(a));
    a.addEventListener('focus', () => place(a));
  });
  nav.addEventListener('mouseleave', () => place(current()));
  nav.addEventListener('focusout', e => { if (!nav.contains(e.relatedTarget)) place(current()); });
  const setup = () => {
    nav.classList.toggle('has-glide', wide.matches);
    if (wide.matches) place(shown && nav.matches(':hover') ? shown : current(), false);
  };
  wide.addEventListener('change', setup);
  new ResizeObserver(setup).observe(nav);   // also runs once now, before the first paint
  document.fonts?.ready.then(setup);
  // Animate only after the line has been drawn in place once
  requestAnimationFrame(() => requestAnimationFrame(() => bar.classList.remove('instant')));
})();

// Glide to sections when a same-page link is clicked (not on page load).
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || a.hash.length < 2 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const target = document.getElementById(decodeURIComponent(a.hash.slice(1)));
  if (!target) return;
  e.preventDefault();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  history.pushState(null, '', a.hash);
});

// Homepage intro: type the name out, then let the rest of the page rise in.
(() => {
  const root = document.documentElement;
  if (!root.classList.contains('intro')) return;
  const el = document.querySelector('.home-name');
  if (!el) { root.classList.remove('intro'); return; }
  try { sessionStorage.setItem('intro-seen', '1'); } catch (e) {}
  const original = el.innerHTML;
  const chars = [];
  el.childNodes.forEach(n => {
    if (n.nodeType === 3) chars.push(...n.textContent);
    else if (n.nodeName === 'BR') chars.push('\n');
  });
  el.style.minHeight = el.getBoundingClientRect().height + 'px';
  el.setAttribute('aria-label', el.textContent);
  const typed = document.createElement('span');
  typed.setAttribute('aria-hidden', 'true');
  const caret = document.createElement('span');
  caret.className = 'type-caret';
  caret.setAttribute('aria-hidden', 'true');
  el.replaceChildren(typed, caret);
  el.style.visibility = 'visible';
  let i = 0;
  const finish = () => {
    el.style.animation = 'none'; // already on screen; don't replay the entrance
    el.innerHTML = original;
    el.removeAttribute('aria-label');
    el.style.minHeight = '';
    root.classList.remove('intro');
  };
  const step = () => {
    if (i >= chars.length) { setTimeout(finish, 260); return; }
    const c = chars[i++];
    if (c === '\n') typed.appendChild(document.createElement('br')); else typed.append(c);
    setTimeout(step, c === ' ' ? 18 : 32);
  };
  setTimeout(step, 420);
})();
// Homepage photo: click to flip it over and back. The handwritten note changes each
// time the back comes up, four versions in all; the last one stays (per page load).
(() => {
  const btn = document.querySelector('.home-photo-btn');
  if (!btn) return;
  const [front, back] = btn.querySelectorAll('img');
  const note = document.querySelector('.photo-note');
  const text = note?.querySelector('.photo-note-text');
  const sub = note?.querySelector('.photo-note-sub');
  // [first line, second line]; the first comes from index.qmd
  const notes = [
    [text?.textContent, sub?.textContent],
    ['still 4th year, promise!', 'same photo as before'],
    ['you can stop now', "it isn't going to change"],
    ['ok, you win', 'maybe read a paper instead?'],
  ];
  let backs = 0;
  btn.addEventListener('click', () => {
    const flipped = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', String(flipped));
    front.setAttribute('aria-hidden', String(flipped));
    back.setAttribute('aria-hidden', String(!flipped));
    if (flipped && text && sub) {
      [text.textContent, sub.textContent] = notes[Math.min(backs++, notes.length - 1)];
    }
    note?.classList.toggle('is-shown', flipped);
  });
})();

// Navbar flower (wide screens, homepage only, where the name link has nowhere to go):
// each click drops a petal; every fifth click brings a shower of them down.
(() => {
  const link = document.querySelector('.navbar .me-auto .nav-item:first-child .nav-link');
  if (!link || !document.body.classList.contains('home')) return;
  const wide = matchMedia('(min-width: 992px)');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  // A real sacuanjoche petal: white, yellow at the base (the path's origin) fading out toward the tip
  const petal = '<svg viewBox="-8 -16 16 17" aria-hidden="true"><path d="M0 0C-2.4-1.6-6.6-4.9-6.3-9.4C-6-13.4-1.2-14.9 2.3-13.4C5.6-12 6.4-7.6 4.4-4.4C3.2-2.4 1.6-1 0 0Z" fill="url(#petal-fill)"/></svg>';
  const gradient = '<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="petal-fill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-14"><stop offset="0" stop-color="#f6c21c"/><stop offset=".3" stop-color="#fbe07a"/><stop offset=".62" stop-color="#fffdf4"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs></svg>';
  let layer = null, clicks = 0;
  const rand = (a, b) => a + Math.random() * (b - a);
  const fall = (x, y, size, delay = 0) => {
    if (!layer) {
      layer = document.createElement('div');
      layer.className = 'petal-layer';
      layer.setAttribute('aria-hidden', 'true');
      layer.innerHTML = gradient;
      document.body.append(layer);
    }
    if (layer.childElementCount > 90) return;
    const el = document.createElement('span');
    el.className = 'petal';
    el.innerHTML = petal;
    Object.assign(el.style, { width: `${size}px`, height: `${size}px`, left: `${x - size / 2}px`, top: `${y - size / 2}px` });
    layer.append(el);
    const dist = innerHeight - y + size * 2;
    const sway = rand(18, 55), phase = rand(0, 6.3), turns = rand(1, 2.2);
    const spin0 = rand(0, 360), spin = rand(160, 520) * (Math.random() < .5 ? -1 : 1);
    const frames = [];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      frames.push({
        transform: `translate(${Math.sin(phase + t * 6.3 * turns) * sway}px, ${t * dist}px) rotate(${spin0 + t * spin}deg) scaleX(${Math.cos(phase + t * 9 * turns).toFixed(3)})`,
        opacity: i === 0 ? 0 : i === 12 ? 0 : 1,
      });
    }
    el.animate(frames, { duration: dist * rand(6, 9), delay, easing: 'linear', fill: 'both' })
      .finished.then(() => el.remove(), () => el.remove());
  };
  link.addEventListener('click', e => {
    if (!wide.matches || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
    e.preventDefault();
    if (scrollY > 0) scrollTo({ top: 0, behavior: reduce.matches ? 'auto' : 'smooth' });
    if (reduce.matches) return;
    const r = link.getBoundingClientRect();
    const fx = r.left + 9, fy = r.top + r.height / 2;   // the 18px flower at the start of the link
    fall(fx, fy, rand(18, 24));
    if (++clicks % 5) return;
    for (let i = 0; i < 34; i++) fall(rand(0, innerWidth), rand(-40, 40), rand(16, 30), rand(80, 2600));
  });
})();

// Nicaraguan days, in a note just below the name in the navbar (wide screens): La Gritería on December 7
// (click the question for the answer) and the fiestas patrias on September 14–15.
// Add ?day=12-07 or ?day=09-15 to the address to see them on any day.
(() => {
  const item = document.querySelector('.navbar .me-auto .nav-item:first-child');
  if (!item) return;
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const day = new URLSearchParams(location.search).get('day') || `${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  let el;
  if (day === '12-07') {
    el = document.createElement('button');
    el.type = 'button';
    el.textContent = '¿Quién causa tanta alegría?';
    el.addEventListener('click', () => { el.textContent = '¡La Concepción de María!'; }, { once: true });
  } else if (day === '09-14' || day === '09-15') {
    el = document.createElement('span');
    el.textContent = '¡Felices fiestas patrias!';
  } else return;
  el.className = 'nav-day';
  el.lang = 'es';
  item.append(el);
})();

// A note for anyone who opens the browser console.
(() => {
  const leaf = 'M0 0C-2.4-1.6-6.6-4.9-6.3-9.4C-6-13.4-1.2-14.9 2.3-13.4C5.6-12 6.4-7.6 4.4-4.4C3.2-2.4 1.6-1 0 0Z';
  const petals = [0, 72, 144, 216, 288].map(a => `<path d="${leaf}" transform="rotate(${a})"/>`).join('');
  const fill = '<radialGradient id="f" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="14"><stop offset="0" stop-color="#f6c21c"/><stop offset=".35" stop-color="#fbe07a"/><stop offset=".7" stop-color="#fffdf4"/><stop offset="1" stop-color="#fff"/></radialGradient>';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs>${fill}</defs><g transform="translate(16 16.6)" fill="url(#f)" stroke="#d9cfae" stroke-width=".7" stroke-linejoin="round">${petals}</g></svg>`;
  const img = `data:image/svg+xml,${encodeURIComponent(svg)}`;
  const body = 'font: 13px/1.6 Georgia, serif;';
  console.log('%c ', `font-size: 1px; padding: 26px; background: url("${img}") center / contain no-repeat;`);
  console.log(
    "%cHi! You're reading the source.%c\n" +
    "It's all public: https://github.com/RRMaximiliano/rrmaximiliano.github.io\n" +
    'Pull requests get reviewed faster than journal submissions.\n\n' +
    'A few other things are hidden around here. Two hints: ↑ ↑ ↓ ↓ ← → ← → B A on the Research page,\n' +
    'and ` (backtick) on any page.',
    `${body} font-size: 15px; color: #A51C30;`, body
  );
})();

// Reviewer 2 mode: the Konami code (↑ ↑ ↓ ↓ ← → ← → B A) on a page that lists papers
// brings in Reviewer 2, who comments on each one. Esc, the button or the code again
// resubmits. Styles in html/custom.scss.
(() => {
  if (!document.querySelector('.pub')) return;
  const code = 'ArrowUp ArrowUp ArrowDown ArrowDown ArrowLeft ArrowRight ArrowLeft ArrowRight b a';
  const comments = [
    'Have the authors considered clustering at a different level?',
    'Interesting, but is it novel?',
    'Please cite Reviewer 2 (2019, 2021, 2023).',
    'What about external validity?',
    'I did not read the appendix, but it should be longer.',
    'Please add a robustness check. Then another one.',
    'Have the authors tried an instrument?',
    'The sample seems small. Please add 400 more schools.',
    'The title is too long.',
    'This result seems obvious in hindsight.',
    'Please move the main result to the appendix.',
    'Minor comment: the whole paper.',
    'Why not a synthetic control?',
    'Have the authors considered writing a different paper?',
  ];
  let keys = [], on = false, card = null, hideTimer = 0;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const showCard = html => {
    clearTimeout(hideTimer);
    if (!card) {
      card = document.createElement('div');
      card.className = 'r2-card';
      card.setAttribute('role', 'status');
      document.body.append(card);
    }
    card.innerHTML = html;
    card.classList.add('is-on');
  };
  const enter = () => {
    on = true;
    document.body.classList.add('r2');
    const list = shuffle(comments.slice());
    let asked = false;
    document.querySelectorAll('.pub').forEach((pub, i) => {
      const registered = [...pub.querySelectorAll('.pub-links a')].some(a => /registry/i.test(a.textContent));
      let text = list[i % list.length];
      if (registered && !asked) { text = 'Was this pre-registered? (Never mind, it is linked below.)'; asked = true; }
      const note = document.createElement('p');
      note.className = 'r2-note';
      note.style.setProperty('--tilt', `${(Math.random() * 2.4 - 1.2).toFixed(2)}deg`);
      note.style.animationDelay = `${i * 90}ms`;
      note.innerHTML = '<span class="r2-tag">R2:</span> ';
      note.append(text);
      pub.querySelector('.pub-title')?.after(note);
    });
    showCard('<span><strong>Decision: major revisions.</strong> Reviewer 2 has left comments.</span><button type="button" class="r2-resubmit">Resubmit</button>');
    card.querySelector('.r2-resubmit').addEventListener('click', exit);
  };
  const exit = () => {
    on = false;
    document.body.classList.remove('r2');
    document.querySelectorAll('.r2-note').forEach(n => n.remove());
    showCard('<span>Resubmitted. Expected decision: 14 months.</span>');
    hideTimer = setTimeout(() => card.classList.remove('is-on'), 3500);
  };
  document.addEventListener('keydown', e => {
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
    if (on && e.key === 'Escape') { exit(); return; }
    // Only arrows and letters count, so Shift (a capital B) or spaces between keys don't break it
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (!/^(Arrow(Up|Down|Left|Right)|[a-z])$/.test(k)) return;
    keys = [...keys, k].slice(-10);
    if (keys.join(' ') === code) { keys = []; on ? exit() : enter(); }
  });
})();

// Stata console. One engine for three places: the prompt on the 404 page, the /stata page,
// and a panel that slides up on any page when you press ` (backtick) or type "stata".
// Everything typed is shown with textContent, never as HTML. Styles in html/custom.scss.
(() => {
  const reg = [
    '',
    'Linear regression                               Number of obs     =      1,461',
    '                                                (nights since the Ph.D. began)',
    '',
    '------------------------------------------------------------------------------',
    '       sleep | Coefficient  Std. err.      t    P>|t|     [95% conf. interval]',
    '-------------+----------------------------------------------------------------',
    '         phd |  -2.713044   .0857661   -31.63   0.000    -2.881282   -2.544806',
    '       _cons |   7.902114   .1203348    65.67   0.000     7.666066    8.138162',
    '------------------------------------------------------------------------------',
  ];
  const help = [
    'Things to try:',
    '  help rrmaximiliano     who wrote this site',
    '  sysuse cv              open the CV',
    '  reg sleep phd          a well-identified result',
    '  view browse "/"        go to a page (also: cd research, cd ~)',
    '  di 2+2                 display',
    '  cls                    clear the screen',
  ];
  const fine = matchMedia('(pointer: fine)');

  // Wire one prompt: `out` collects the log, `form`/`input` take commands.
  // onExit runs on "exit, clear" (the panel closes; elsewhere it goes home).
  const attach = (out, form, input, { onExit, scroller } = {}) => {
    const add = (text, cls, href) => {
      const el = document.createElement(href ? 'a' : 'span');
      el.textContent = text;
      if (cls) el.className = cls;
      if (href) el.href = href;
      out.append(el, '\n');
    };
    const err = (msg, code) => { add(msg, 'stata-err'); add(`r(${code});`, 'stata-err'); };
    const go = path => { add(`(opening ${path})`, 'stata-note'); setTimeout(() => { location.href = path; }, 500); };
    const run = raw => {
      const cmd = raw.trim();
      // The command name ends at a space or a comma, as in Stata ("exit, clear")
      const [, verb = '', args = ''] = cmd.match(/^([^\s,]+)\s*(.*)$/) || [];
      const v = verb.toLowerCase();
      if (!cmd) return;
      if (v === 'cls') { out.textContent = ''; return; }
      if (v === 'clear') return;
      if (v === 'help' || v === 'h') {
        if (/^rrmaximiliano$/i.test(args)) {
          add('rrmaximiliano -- Rony Rodríguez-Ramírez');
          add('    Ph.D. candidate in Education Policy and Program Evaluation');
          add('    at Harvard University.');
          add('    Studies how education can protect and rebuild children\'s human capital');
          add('    after armed conflict, forced displacement, and political crises.');
          add('    From Nicaragua.');
          add('    See also: view browse "/research"', '', '/research/');
          return;
        }
        if (args) { err(`help for ${args} not found`, 111); return; }
        help.forEach(l => add(l));
        return;
      }
      if (v === 'sysuse' || v === 'use') {
        if (/^"?cv"?(,\s*clear)?$/i.test(args)) { add('(Rony Rodríguez-Ramírez, curriculum vitae)'); go('/cv/'); return; }
        const f = args.replace(/,.*$/, '').replace(/"/g, '').trim() || 'nothing';
        err(`file ${f}${/\.dta$/i.test(f) ? '' : '.dta'} not found`, 601);
        return;
      }
      if (/^reg(r(e(ss?)?)?)?$/.test(v)) {
        if (/^sleep\s+phd\b/i.test(args)) { reg.forEach(l => add(l)); return; }
        const missing = args.split(/[\s,]+/).find(x => x && !/^(sleep|phd)$/i.test(x)) || 'varlist';
        err(`variable ${missing} not found`, 111);
        return;
      }
      if (v === 'ssc' || v === 'net') { add('nice try. this is a website.', 'stata-note'); return; }
      if (v === 'pikachu') {
        err('command pikachu is unrecognized', 199);
        add('. * it is a real command, though. read about it here', 'stata-note', '/go/useless/');
        return;
      }
      if (v === 'exit' || v === 'q' || v === 'quit') {
        if (/clear/i.test(args)) { onExit ? onExit() : go('/'); return; }
        err('no; dataset in memory has changed since last saved', 4);
        return;
      }
      if (v === 'di' || v === 'dis' || v === 'disp' || v === 'display') {
        const q = args.match(/^"(.*)"$/);
        if (q) { add(q[1]); return; }
        if (/^[\d\s+\-*/().]+$/.test(args)) {   // numbers and operators only, so this can't run code
          try { const n = Function(`"use strict"; return (${args})`)(); if (Number.isFinite(n)) { add(String(n)); return; } } catch (e) {}
        }
        err('invalid syntax', 198);
        return;
      }
      if (v === 'cd' || (v === 'view' && /^browse\b/i.test(args))) {
        let path = (v === 'cd' ? args : args.replace(/^browse\s*/i, '')).replace(/"/g, '').trim();
        if (!path || path === '~' || path === '/') { go('/'); return; }
        if (/^[a-z]+:/i.test(path) || path.startsWith('//')) { add('only pages on this site, sorry.', 'stata-note'); return; }
        if (!path.startsWith('/')) path = '/' + path;
        if (!/^\/[\w\-./]*$/.test(path)) { err('invalid syntax', 198); return; }
        go(path.endsWith('/') || /\.\w+$/.test(path) ? path : path + '/');
        return;
      }
      err(`command ${verb} is unrecognized`, 199);
    };
    const history = [];
    let at = 0;
    form.addEventListener('submit', e => {
      e.preventDefault();
      const cmd = input.value;
      add(`. ${cmd}`);
      if (cmd.trim()) { history.push(cmd); at = history.length; }
      input.value = '';
      run(cmd);
      if (scroller) scroller.scrollTop = scroller.scrollHeight;
      else input.scrollIntoView({ block: 'nearest' });
    });
    input.addEventListener('keydown', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      at = Math.max(0, Math.min(history.length, at + (e.key === 'ArrowUp' ? -1 : 1)));
      input.value = history[at] ?? '';
    });
  };

  // A prompt that is part of the page (404, /stata): ready to type on computers
  // (phones would pop the keyboard open, so not there)
  const pageForm = document.querySelector('.stata-log .stata-prompt');
  if (pageForm) {
    const input = pageForm.querySelector('input');
    attach(pageForm.closest('.stata-log').querySelector('.stata-out'), pageForm, input);
    if (fine.matches) input.focus({ preventScroll: true });
  }

  // The panel, built on first use
  let panel = null, panelInput = null, returnTo = null;
  const close = () => {
    if (!panel?.classList.contains('is-open')) return;
    panel.classList.remove('is-open');
    if (returnTo?.isConnected) returnTo.focus({ preventScroll: true });
  };
  const open = () => {
    if (pageForm) { pageForm.querySelector('input').focus(); return; }
    if (!panel) {
      panel = document.createElement('section');
      panel.className = 'stata-panel';
      panel.setAttribute('aria-label', 'Stata console');
      panel.innerHTML =
        '<div class="stata-panel-bar"><span>Stata</span><button type="button" class="stata-close">Esc to close</button></div>' +
        '<div class="stata-log stata-panel-log"><span class="stata-note">. * Stata, for this site. Type help to start.</span>\n' +
        '<div class="stata-out" aria-live="polite"></div><form class="stata-prompt" autocomplete="off"><label for="stata-panel-cmd">.</label> ' +
        '<input id="stata-panel-cmd" type="text" spellcheck="false" autocapitalize="off" enterkeyhint="go" aria-label="Stata command"></form></div>';
      document.body.append(panel);
      const log = panel.querySelector('.stata-panel-log');
      panelInput = panel.querySelector('input');
      attach(log.querySelector('.stata-out'), panel.querySelector('form'), panelInput, { onExit: close, scroller: log });
      panel.querySelector('.stata-close').addEventListener('click', close);
      panel.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); close(); } });
      panel.getBoundingClientRect();   // lay it out closed first, so opening animates
    }
    returnTo = document.activeElement;
    panel.classList.add('is-open');
    panelInput.focus({ preventScroll: true });
  };
  let typed = '';
  document.addEventListener('keydown', e => {
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '`') { e.preventDefault(); open(); return; }
    // Typing "stata" works too (keyboards where ` is awkward to reach)
    if (e.key.length !== 1) return;
    typed = (typed + e.key.toLowerCase()).slice(-5);
    if (typed === 'stata') { typed = ''; e.preventDefault(); open(); }   // keep the last "a" out of the prompt
  });
})();

// Office hours, late at night (the visitor's time, 1–5 a.m.): a note to go to sleep.
// Add ?late to the address to see it at any hour.
(() => {
  if (!location.pathname.startsWith('/office-hours/')) return;
  const notice = document.querySelector('.oh-notice');
  const now = new Date();
  const late = now.getHours() >= 1 && now.getHours() < 5;
  if (!notice || !(late || new URLSearchParams(location.search).has('late'))) return;
  const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const p = document.createElement('p');
  p.className = 'oh-late';
  p.textContent = `It's ${time} where you are. Office hours aren't right now. Go to sleep; the problem set will still be there in the morning.`;
  notice.before(p);
})();
</script>
