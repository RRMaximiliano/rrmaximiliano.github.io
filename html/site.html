<script>

// Highlight the navbar section for pages below it (e.g. /office-hours/api-209/).
(() => {
  const here = location.pathname.replace(/index\.html$/, '');
  const links = [...document.querySelectorAll('#navbarCollapse .navbar-nav:not(.me-auto) a.nav-link')];
  if (links.some(a => a.classList.contains('active'))) return;
  let best = null, bestLen = 0;
  for (const a of links) {
    const p = new URL(a.href, location.href).pathname.replace(/index\.html$/, '');
    if (p.length > 1 && here.startsWith(p) && p.length > bestLen) { best = a; bestLen = p.length; }
  }
  if (best) { best.classList.add('active'); best.setAttribute('aria-current', 'page'); }
})();
</script>
