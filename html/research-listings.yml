# Listing setup for the homepage (paths from the project root).
# The homepage shows only working papers and works in progress; /research shows everything.
# You normally don't need to edit this; edit research/papers.yml instead.
listing:
  - id: working
    contents: /research/papers.yml
    template: /html/papers.ejs
    include:
      group: working
    sort: false
  - id: progress
    contents: /research/papers.yml
    template: /html/papers.ejs
    include:
      group: progress
    sort: false
