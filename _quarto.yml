project:
  type: website

  preview: 
    port: 5555
    browser: true
    watch-inputs: true
    navigate: true
    
  output-dir: docs
  post-render:
    - html/post-render.py   # 404 font paths; note at the top of every page source
  render:
    - "*.qmd"
    - "!about.qmd"     # old Bio page; about.html now redirects home

resources:
  - fonts/
  - go/
  - office-hours/booking.js   # booking widget for the office-hours pages
  - favicon.svg
  - files/img/rony-back.jpg   # back of the homepage photo (shown on click)
  - favicon.ico
  - apple-touch-icon.png
  - brand/sacuanjoche-line.svg
  - about.html

website:
  draft-mode: gone
  search: false
  page-navigation: true
  site-url: "https://www.rrmaximiliano.com/"
  # Link previews (Slack, X, email): photo, title and this summary
  image: https://www.rrmaximiliano.com/files/img/rony.jpg
  open-graph:
    description: &summary "Ph.D. candidate in Education Policy and Program Evaluation at Harvard University, studying how education systems can protect and rebuild human capital after conflict, displacement, and political crises."
  twitter-card:
    description: *summary
  repo-url: "https://github.com/RRMaximiliano/rrmaximiliano.github.io"
  navbar:
    pinned: true

    left:
      - text: "Rony Rodríguez-Ramírez"
        file: index.qmd

    right:
      - text: "Research"
        file: research/index.qmd
      - text: "Teaching"
        file: teaching/index.qmd
      - text: "Office Hours"
        file: office-hours/index.qmd
      - text: "Software and Data"
        file: projects/index.qmd
      - text: "CV"
        file: cv/index.qmd
      - text: "Blog"
        file: blog/index.qmd
      - text: "Resources"
        file: resource/index.qmd

  page-footer:
    border: true  
    left: >-
      &#169; <span id="copy-year"></span> Rony Rodríguez-Ramírez · Made with [Quarto](https://quarto.org) in <svg class="footer-r" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.746c-6.627 0-12 3.599-12 8.037 0 3.897 4.144 7.144 9.64 7.880V16.26c-2.924-.915-4.925-2.755-4.925-4.877 0-3.035 4.084-5.494 9.120-5.494 5.038 0 8.757 1.683 8.757 5.494 0 1.976-.999 3.379-2.662 4.272.090.066.174.128.258.216.169.149.250.363.372.544 2.128-1.450 3.440-3.437 3.440-5.631 0-4.440-5.373-8.038-12-8.038zm-2.111 4.990v13.516l4.093-.002-.002-5.291h1.100c.225 0 .321.066.549.250.272.220.715.982.715.982l2.164 4.063 4.627-.002-2.864-4.826s-.086-.193-.265-.383a2.220 2.220 0 00-.582-.416c-.422-.214-1.149-.434-1.149-.434s3.578-.264 3.578-3.826c0-3.562-3.744-3.630-3.744-3.630zm4.127 2.930l2.478.002s1.149-.062 1.149 1.127c0 1.165-1.149 1.170-1.149 1.170h-2.478zm1.754 6.119c-.494.049-1.012.079-1.540.088v1.807a16.622 16.622 0 002.370-.473l-.471-.891s-.108-.183-.248-.394c-.039-.054-.080-.098-.111-.137z"/></svg> R
      <script>
        document.addEventListener('DOMContentLoaded', () =>
          document.getElementById('copy-year').textContent = new Date().getFullYear()
        );
      </script>
    right: >-
      [Contact Me](/contact.qmd) | [View the source on <svg class="footer-gh" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg> GitHub]({{< var github-url >}})

format:
  html:
    theme:
      light:
        - html/custom.scss
      dark:
        - html/custom.scss
        - html/dark.scss
    respect-user-color-scheme: true
    highlight-style: github
    html-math-method: plain   # no math on the site; switch to mathjax in a post that needs it
    include-in-header: html/head.html
    include-after-body:
      - html/toc-tree.html
      - html/site.html
    toc-title: Tree
    toc-expand: true
    toc: true
    grid:
      body-width: 720px
