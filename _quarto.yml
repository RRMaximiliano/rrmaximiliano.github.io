project:
  type: website

  preview: 
    port: 5555
    browser: true
    watch-inputs: true
    navigate: true
    
  output-dir: docs
  render:
    - "*.qmd"

resources:
  - fonts/
  - go/

website:
  draft-mode: gone
  search: false
  page-navigation: true
  site-url: "https://www.rrmaximiliano.com/"
  repo-url: "https://github.com/RRMaximiliano/rrmaximiliano.github.io"
  navbar:
    pinned: true

    left:
      - text: "Rony Rodríguez-Ramírez"
        file: index.qmd

    right:
      - text: "Research"
        file: research/index.qmd
      - text: "Teaching"
        file: teaching/index.qmd
      - text: "Office Hours"
        file: office-hours/index.qmd
      - text: "Software and Data"
        file: projects/index.qmd
      - text: "CV"
        file: cv/index.qmd
      - text: "Blog"
        file: blog/index.qmd
      - text: "Resources"
        file: resource/index.qmd

  page-footer:
    border: true  
    left: >-
      &#169; <span id="copy-year"></span> Rony Rodríguez-Ramírez
      <script>
        document.addEventListener('DOMContentLoaded', () =>
          document.getElementById('copy-year').textContent = new Date().getFullYear()
        );
      </script>
    right: >-
      [Contact Me](/contact.qmd) | [View the source on {{< fa brands github >}} GitHub]({{< var github-url >}})

format:
  html:
    theme:
      light:
        - html/custom.scss
      dark:
        - html/custom.scss
        - html/dark.scss
    respect-user-color-scheme: true
    include-in-header: html/head.html
    include-after-body:
      - html/toc-tree.html
      - html/site.html
    toc-title: Tree
    toc-expand: true
    toc: true
    grid:
      body-width: 720px
