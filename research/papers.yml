- title: "From Closure to Recovery: Tracing the Educational Impact of COVID-19 in Chile"
  group: published-chapters
  coauthors:
    - {name: "Emiliana Vegas", url: "https://www.emilianavegas.com/"}
    - {name: "Álvaro Hofflinger", url: "https://alvarohofflinger.com/"}
  links:
    - {text: "Ungated Version", url: "/files/pdfs/vegas_et_al_2024_chile.pdf"}
    - {text: "Publisher Version", url: "https://link.springer.com/chapter/10.1007/978-3-031-69284-0_2"}
  abstract: >-
    This chapter analyzes the effects of school closures in Chile, the nation with the longest
    period of school closures among OECD countries. Using data from PISA (national level) and SIMCE
    (student level) in 2022, we examine the association between school closures and students’ GPA,
    attendance rates, and math and reading scores. Our findings show that, on average, students’
    attendance rates and math and reading scores experienced a decline, while their annual GPA
    increased after 2020. The results also show that school closures affect students differently
    depending on their demographic and socioeconomic backgrounds.

- title: "The rise of post-pandemic bullying and its association with student achievement and school attachment: Evidence from Chile"
  group: published-papers
  coauthors:
    - {name: "Álvaro Hofflinger", url: "https://alvarohofflinger.com/"}
    - {name: "Emiliana Vegas", url: "https://www.emilianavegas.com/"}
  venue: "International Journal of Educational Development"
  details: "Vol. 127, Nov 2026, 103677."
  links:
    - {text: "Publisher Version", url: "https://doi.org/10.1016/j.ijedudev.2026.103677"}
  abstract: >-
    Most of the research on the pandemic has focused on assessing the impact of school closures on
    learning loss. Less attention has been paid to how school social dynamics changed after
    COVID-19. In this study, we examine whether bullying increased after the pandemic and whether
    the association between bullying exposure and student achievement changed in the post-pandemic
    period. To do so, we used student-level census data from 10th graders before and after the
    pandemic in Chile, which experienced the most extensive school closures among OECD countries. We
    compare 10th-grade students before the pandemic (in 2016 and 2018) with those after the pandemic
    (in 2022). All forms of bullying (physical, verbal, social, and via the internet) increased in
    the post-pandemic cohort, with the increases concentrated among already-vulnerable groups for
    physical and cyberbullying. Moreover, the achievement gap between bullied and non-bullied
    students widened after the pandemic: bullying exposure in 2022 is associated with significantly
    lower scores in mathematics and reading, and GPA than the same exposure before the pandemic.
    Students exposed to bullying also report weaker attachment to their schools. While our cohort-
    comparison design does not identify the causal effect of bullying on learning, the patterns we
    document suggest that the deterioration of school social dynamics may be one of the most
    important long-term legacies of the pandemic.

- title: "Does the small business program benefit self-employed workers? Evidence from Nicaragua"
  group: published-papers
  coauthors:
    - {name: "Booyuel Kim", url: "https://sites.google.com/site/booyuelkim/home"}
    - {name: "Hee-Seung Yang", url: "https://sites.google.com/site/heeseungyang/"}
  venue: "Journal of Development Effectiveness"
  details: "Jan 2024, 1–20."
  links:
    - {text: "Publisher Version", url: "https://www.tandfonline.com/doi/full/10.1080/19439342.2023.2300138"}
  abstract: >-
    Business and skills training programmes have been a popular social policy intervention to
    increase productivity of the self-employed in developing countries. We study the Small Business
    of the Family Economy programme, a government business training programme designed to assist
    Nicaraguan self-employed workers. Using data from three rounds of the Nicaragua Living Standards
    Measurement Survey, we employ a difference-in-differences strategy to exploit variation in
    eligibility for the programme across time and economic activity. Our estimates indicate that the
    programme does not increase self-employed workers’ earnings overall. However, we find
    heterogeneous treatment effects for female self-employed workers with low educational
    attainment, which could be explained by increased working months and having a second job.

- title: "Investing in Human Capital during Wartime: Experimental Evidence from Ukraine"
  group: working
  coauthors:
    - {name: "Harry Patrinos", url: "https://hpatrinos.com/"}
    - {name: "Renata Lemos", url: "https://renatalemos.com/"}
    - {name: "Lelys Dinarte", url: "https://sites.google.com/view/lelys-dinarte/home"}
    - {name: "James Gresham"}
  links:
    - {text: "Working Paper", url: "https://renatalemos.com/wp-content/uploads/2026/03/ukraine_03222026.pdf"}
    - {text: "AEA RCT Registry", url: "https://www.socialscienceregistry.org/trials/9328"}
    - {text: "Policy Brief", url: "https://thedocs.worldbank.org/en/doc/c2e290b2b8b55ac737e754a52617ff79-0090052026/original/E2P-Ukraine.pdf?deliveryName=FCP_6_DM274129"}
  abstract: >-
    This paper provides insights into human capital investments during wartime by presenting
    evidence from three experiments of an online tutoring program for Ukrainian students amid
    Russia’s invasion of Ukraine. The program provides three hours of weekly math and Ukrainian
    language tutoring in small groups over six weeks, and uses academic and psychosocial tools to
    address student challenges at different intensities of disruption. Results from all three
    experiments show significant improvements in math and Ukrainian language scores by as much as
    0.49 SD and 0.40 SD and a reduction in stress levels by up to 0.12 SD. The program improves peer
    support, fosters positive learning attitudes, and helps students develop social-emotional
    skills, contributing to improved learning and mental health. The benefit-cost ratios show that
    benefits exceed costs in each experiment.

- title: "Shared decision-making: Does quality of care affect contraceptive use?"
  group: working
  coauthors:
    - {name: "Berk Özler", url: "https://sites.google.com/site/decrgberkozler/home"}
    - {name: "Luca Parisotto", url: "https://sites.google.com/view/lucaparisotto/home"}
  links:
    - {text: "Working Paper", url: "/files/pdfs/ozler_et_al_2025_cameroon_qoc.pdf"}
  abstract: >-
    Whether higher quality of care in contraceptive counselling improves client outcomes is an
    important question that does not find a clear answer in the extant literature. Using a trial
    that tested various approaches to increase the uptake of modern contraceptives among the clients
    of an urban hospital in Cameroon as its background, this study examines the association between
    a quality of care index for contraceptive counselling and the probability of using a modern
    method approximately four months later. We find that high quality contraceptive counselling is
    associated with higher levels of contraceptive use at follow-up and greater client satisfaction.
    While previous studies have primarily focused on continuation rates among contraceptive users,
    this study shows that high quality of care can be also instrumental by potentially increasing
    take-up rates among all clients. The study also shows that a quality of care measure that was
    validated in rural India can be easily and reliably used to assess process quality in urban
    Cameroon.

- title: "In utero exposure to civil conflict: Nicaraguan war and its long-term effects on socioeconomic outcomes"
  group: working
  coauthors:
    - {name: "Booyuel Kim", url: "https://sites.google.com/site/booyuelkim/home"}
    - {name: "Hee-Seung Yang", url: "https://sites.google.com/site/heeseungyang/"}
  abstract: >-
    We examine the Nicaraguan Civil conflict in the seventies that ended up with the overthrown of
    the Somoza dictatorship and the start of the Sandinista Revolution. Nicaragua between 1977 and
    1979 experienced high rates of war confrontation. After the announcement of the Sandinista
    National Liberation Front (FSLN, by its acronym in Spanish) in November of 1977, the country had
    undergone a civil war which ended up with a range of 30,000-50,000 casualties. The escalated
    confrontation allows us to examine the long-term effects of the war-related conflict on the
    subsequent generation’s socioeconomic outcomes. In particular, this paper aims to identify
    whether in-utero exposure to the civil conflict in Nicaragua has a negative impact on
    individual’s education, labor and marriage market outcomes. We exploit the variation in timing
    of and geographical exposure to the civil conflict during the last year of the dictatorship. We
    use data from the Nicaraguan National Census to exploit differences across regions and across
    cohorts, our preliminary findings indicate that the civil conflict negatively affected those
    exposed to the conflict in utero. In particular, the long-term consequences of the war decreased
    educational attainment, formal employability, and thus reducing lifetime earnings, especially
    for females. The exposure to the civil conflict also seems to decrease marriage probability.

