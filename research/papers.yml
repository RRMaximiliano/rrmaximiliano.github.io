- title: "Crítica y crisis en Nicaragua: la tensión entre democracia y capitalismo"
  group: predoc-papers
  coauthors:
    - {name: "Hloreley Osorio"}
  venue: "Anuario de Estudios Centroamericanos"
  details: "46 (2020), 1–42."
  links:
    - {text: "Ungated Version", url: "https://www.redalyc.org/journal/152/15264516019/15264516019.pdf"}
  abstract: >-
    From a structure and agency perspective, this article analyzes the criticism and crisis in
    Nicaragua during the Ortega administration (2007-2020). It shows that the "singular trials" of
    social sectors to curb authoritarianism and capitalism, interpreted by the government as enemies
    of progress (2007- March 2018), went through a "general judgment" of social and business sectors
    represented in the Alianza Cívica that, witnessing crimes against humanity, criticize
    authoritarianism and injustice, which the government evaluates as an attempted coup (April
    2018-2020). The conflict between trials led to a national dialogue with partial decisions, while
    the socio-political and economic crisis deepens. The analysis reveals the need for promoting
    democracy with social justice

- title: "Movimientos sociales y acción colectiva en Nicaragua: Entre la identidad, autonomía y subordinación"
  group: predoc-papers
  coauthors:
    - {name: "Mario Sánchez"}
    - {name: "Douglas Castro"}
    - {name: "Jorge Guerra"}
  venue: "Amnis"
  details: "(15), 2016."
  links:
    - {text: "Publisher Version", url: "https://amnis.revues.org/2813"}
  abstract: >-
    This article analyzes the evolution of three social movements (Natives, women and workers) at
    key moments of the history of Nicaragua: the dictatorship of Somoza (1934-1979), the Sandinista
    revolution (1979-1990) and the neoliberal era (1990-2000).

- title: "¿Ha sido importante la cooperación internacional para el desarrollo y el crecimiento económico?"
  group: predoc-papers
  coauthors:
    - {name: "Carol Siero"}
    - {name: "Sebastián Hernández"}
  venue: "Encuentro"
  details: "102 (2015), 52–74."
  links:
    - {text: "Ungated Version", url: "/files/pdfs/siero_et_al_2015_cooperacion_internacional.pdf"}
  abstract: >-
    La cooperación internacional al desarrollo ha sido divulgada como una operación que se realiza
    con el objetivo de promover el desarrollo y crecimiento económico de los países. Sin embargo, la
    cooperación no solamente se basa en la idea del mejoramiento económico de los países sino
    también en las relaciones político-económicas que los países tienen y en la forma en que éstos
    administran los recursos. Esto sugiere que el estudio de la cooperación debe abordar contextos,
    políticas e ideales tanto de los cooperantes como de los beneficiarios. En el presente artículo
    se desarrollaron dos modelos econométricos, estimados a través de datos panel. Primero, un
    modelo de selectividad que hace referencia a la cantidad de dinero desembolsado a sectores
    estratégicos de la economía por parte de los donantes y, segundo, un modelo de eficacia de la
    cooperación para valorar la incidencia de la ayuda en el desarrollo y crecimiento económico. A
    través de estos dos modelos, el paradigma actual de la cooperación presenta debilidades al
    momento de establecer ejes estratégicos. Por esto, es necesario que el debate sobre el rol de la
    cooperación tenga un carácter activo en las políticas tanto de los países cooperantes como de
    los beneficiarios.

